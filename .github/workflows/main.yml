name: Windows RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest

    steps:

      # ============================================================
      # 1. Configure Windows RDP
      # ============================================================
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "       CONFIGURING WINDOWS RDP"
          Write-Host "========================================"

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          # Enable Network Level Authentication
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          # Standard RDP security
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 1 `
            -Force

          # Remove old custom firewall rule
          netsh advfirewall firewall delete rule `
            name="RDP-Tailscale" `
            >$null 2>&1

          # Allow RDP only from Tailscale IPv4 range
          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389 `
            remoteip=100.64.0.0/10

          # Restart RDP service
          Restart-Service -Name TermService -Force

          Start-Sleep -Seconds 3

          # Verify RDP service
          $rdpService = Get-Service -Name TermService -ErrorAction Stop

          if ($rdpService.Status -ne "Running") {
              throw "Remote Desktop service is not running."
          }

          Write-Host ""
          Write-Host "RDP configuration completed."
          Write-Host "RDP service: $($rdpService.Status)"
          Write-Host "RDP port: 3389"
          Write-Host "Allowed source: 100.64.0.0/10"

      # ============================================================
      # 2. Create RDP User
      # ============================================================
      - name: Create RDP User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "          CREATING RDP USER"
          Write-Host "========================================"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              throw "RDP_PASSWORD secret is not configured."
          }

          # Convert password to SecureString
          $securePass = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          # Check whether user already exists
          $existingUser = Get-LocalUser `
            -Name "RDP" `
            -ErrorAction SilentlyContinue

          if ($existingUser) {
              Write-Host "Existing RDP user found. Removing it..."

              Remove-LocalUser `
                -Name "RDP" `
                -ErrorAction SilentlyContinue

              Start-Sleep -Seconds 2
          }

          # Create user
          New-LocalUser `
            -Name "RDP" `
            -Password $securePass `
            -AccountNeverExpires `
            -PasswordNeverExpires `
            -UserMayNotChangePassword `
            -Description "Temporary GitHub RDP user" `
            -ErrorAction Stop

          # Add to Administrators
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          # Add to Remote Desktop Users
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          # Verify user
          $user = Get-LocalUser `
            -Name "RDP" `
            -ErrorAction Stop

          if (-not $user.Enabled) {
              Enable-LocalUser -Name "RDP"
          }

          Write-Host ""
          Write-Host "RDP user created successfully."
          Write-Host "Username: RDP"
          Write-Host "Enabled: $($user.Enabled)"

      # ============================================================
      # 3. Install Tailscale
      # ============================================================
      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "          INSTALLING TAILSCALE"
          Write-Host "========================================"

          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
          $installerPath = "$env:TEMP\tailscale-setup.exe"

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath `
            -UseBasicParsing

          if (-not (Test-Path $installerPath)) {
              throw "Tailscale installer was not downloaded."
          }

          Write-Host "Installing Tailscale..."

          $installer = Start-Process `
            -FilePath $installerPath `
            -ArgumentList "/quiet", "/norestart" `
            -Wait `
            -PassThru `
            -NoNewWindow

          if ($installer.ExitCode -ne 0) {
              throw "Tailscale installer failed with exit code $($installer.ExitCode)."
          }

          Start-Sleep -Seconds 10

          # Possible executable locations
          $possiblePaths = @(
            "$env:ProgramFiles\Tailscale\tailscale.exe",
            "${env:ProgramFiles(x86)}\Tailscale\tailscale.exe",
            "$env:LOCALAPPDATA\Tailscale\tailscale.exe"
          )

          $tailscaleExe = $null

          foreach ($path in $possiblePaths) {
              if (Test-Path $path) {
                  $tailscaleExe = $path
                  break
              }
          }

          # Fallback search
          if (-not $tailscaleExe) {
              Write-Host "Searching for tailscale.exe..."

              $found = Get-ChildItem `
                -Path "C:\Program Files", "C:\Program Files (x86)" `
                -Recurse `
                -Filter "tailscale.exe" `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                  $tailscaleExe = $found.FullName
              }
          }

          if (-not $tailscaleExe) {
              throw "tailscale.exe was not found."
          }

          Write-Host ""
          Write-Host "Tailscale executable:"
          Write-Host $tailscaleExe

          Write-Host ""
          Write-Host "Tailscale version:"
          & $tailscaleExe version

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale executable could not be started."
          }

          # Make executable available to all following steps
          "TAILSCALE_EXE=$tailscaleExe" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          Write-Host ""
          Write-Host "Tailscale installation completed."

      # ============================================================
      # 4. Connect Tailscale
      # ============================================================
      - name: Establish Tailscale Connection
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          $tailscale = $env:TAILSCALE_EXE

          if ([string]::IsNullOrWhiteSpace($tailscale)) {
              throw "TAILSCALE_EXE is not available."
          }

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
              throw "TAILSCALE_AUTH_KEY secret is not configured."
          }

          Write-Host "========================================"
          Write-Host "       CONNECTING TO TAILSCALE"
          Write-Host "========================================"

          $hostname = "gh-runner-$env:GITHUB_RUN_ID"

          Write-Host "Hostname: $hostname"

          # Connect and advertise Exit Node
          & $tailscale up `
            --auth-key=$env:TAILSCALE_AUTH_KEY `
            --hostname="$hostname" `
            --accept-routes `
            --accept-dns=true `
            --unattended=true `
            --advertise-exit-node

          $upExitCode = $LASTEXITCODE

          if ($upExitCode -ne 0) {

              Write-Host ""
              Write-Host "Tailscale connection failed."
              Write-Host "Exit code: $upExitCode"

              Write-Host ""
              Write-Host "Current Tailscale status:"
              & $tailscale status

              throw "Tailscale authentication failed."
          }

          Write-Host ""
          Write-Host "Tailscale authentication successful."

          # Explicitly advertise Exit Node
          & $tailscale set --advertise-exit-node=true

          if ($LASTEXITCODE -ne 0) {
              Write-Warning "Could not explicitly set advertise-exit-node."
              Write-Warning "Continuing because tailscale up already requested it."
          }
          else {
              Write-Host "Exit Node advertisement enabled."
          }

          # Wait for Tailscale IPv4
          $tsIP = $null

          for ($i = 1; $i -le 30; $i++) {

              $rawIP = (& $tailscale ip -4 2>$null | Out-String).Trim()

              if ($rawIP -match '\b100\.\d{1,3}\.\d{1,3}\.\d{1,3}\b') {
                  $tsIP = $Matches[0]
                  break
              }

              Write-Host "Waiting for Tailscale IP... $i/30"
              Start-Sleep -Seconds 2
          }

          if (-not $tsIP) {

              Write-Host ""
              Write-Host "Tailscale status:"
              & $tailscale status

              throw "Tailscale IP was not assigned."
          }

          # Save IP for following steps
          "TAILSCALE_IP=$tsIP" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          Write-Host ""
          Write-Host "========================================"
          Write-Host "       TAILSCALE CONNECTION READY"
          Write-Host "========================================"
          Write-Host "Tailscale IP : $tsIP"
          Write-Host "Hostname     : $hostname"
          Write-Host "Exit Node    : ADVERTISED"
          Write-Host "========================================"

      # ============================================================
      # 5. Diagnostics
      # ============================================================
      - name: Tailscale Diagnostics
        shell: powershell
        continue-on-error: true
        run: |
          $tailscale = $env:TAILSCALE_EXE

          Write-Host ""
          Write-Host "========================================"
          Write-Host "       TAILSCALE NETWORK DIAGNOSTICS"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "===== TAILSCALE IP ====="
          & $tailscale ip -4
          Write-Host "Exit code: $LASTEXITCODE"

          Write-Host ""
          Write-Host "===== TAILSCALE STATUS ====="
          & $tailscale status
          Write-Host "Exit code: $LASTEXITCODE"

          Write-Host ""
          Write-Host "===== TAILSCALE NETCHECK ====="
          & $tailscale netcheck
          Write-Host "Exit code: $LASTEXITCODE"

          Write-Host ""
          Write-Host "===== TAILSCALE EXIT NODE ====="
          & $tailscale exit-node list
          Write-Host "Exit code: $LASTEXITCODE"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "       DIAGNOSTICS COMPLETED"
          Write-Host "========================================"

          # Diagnostics are informational only
          exit 0

      # ============================================================
      # 6. Verify Tailscale IP
      # ============================================================
      - name: Verify Tailscale Connection
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "       VERIFYING TAILSCALE"
          Write-Host "========================================"

          $tsIP = $env:TAILSCALE_IP

          if ([string]::IsNullOrWhiteSpace($tsIP)) {
              throw "TAILSCALE_IP is empty."
          }

          Write-Host "Tailscale IP: $tsIP"

          # Verify IP exists locally
          $localIPs = Get-NetIPAddress `
            -AddressFamily IPv4 `
            -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty IPAddress

          if ($localIPs -notcontains $tsIP) {

              Write-Host ""
              Write-Host "Local IPv4 addresses:"

              foreach ($ip in $localIPs) {
                  Write-Host " - $ip"
              }

              throw "Tailscale IP is not assigned to a local interface."
          }

          Write-Host ""
          Write-Host "Tailscale IP verified successfully."

      # ============================================================
      # 7. Verify RDP
      # ============================================================
      - name: Verify RDP Service
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "          VERIFYING RDP"
          Write-Host "========================================"

          # Verify RDP service
          $rdpService = Get-Service `
            -Name "TermService" `
            -ErrorAction Stop

          Write-Host "TermService status: $($rdpService.Status)"

          if ($rdpService.Status -ne "Running") {
              throw "Remote Desktop service is not running."
          }

          # Verify RDP listener
          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $listener) {

              Write-Host ""
              Write-Host "Port 3389 listener was not found."

              Get-NetTCPConnection `
                -State Listen `
                -ErrorAction SilentlyContinue |
                Format-Table -AutoSize

              throw "RDP is not listening on TCP port 3389."
          }

          Write-Host ""
          Write-Host "RDP is listening on TCP port 3389."

          # Verify firewall rule exists
          $firewallRule = Get-NetFirewallRule `
            -DisplayName "RDP-Tailscale" `
            -ErrorAction SilentlyContinue

          if (-not $firewallRule) {
              throw "RDP-Tailscale firewall rule was not found."
          }

          Write-Host "RDP firewall rule verified."

          Write-Host ""
          Write-Host "========================================"
          Write-Host "             RDP READY"
          Write-Host "========================================"

      # ============================================================
      # 8. Display Access Information
      # ============================================================
      - name: Display Access Information
        if: success()
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "          RDP ACCESS INFORMATION"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "Tailscale IP : $env:TAILSCALE_IP"
          Write-Host "RDP Port     : 3389"
          Write-Host "Username     : RDP"
          Write-Host "Password     : GitHub Secret RDP_PASSWORD"
          Write-Host ""
          Write-Host "Exit Node    : ADVERTISED"
          Write-Host ""
          Write-Host "========================================"

      # ============================================================
      # 9. Keep Runner Alive
      # ============================================================
      - name: Keep Runner Alive
        if: success()
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "          RUNNER IS ACTIVE"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "Tailscale IP : $env:TAILSCALE_IP"
          Write-Host "RDP Port     : 3389"
          Write-Host "Username     : RDP"
          Write-Host "Exit Node    : ENABLED / ADVERTISED"
          Write-Host ""
          Write-Host "========================================"
          Write-Host ""

          while ($true) {

              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] Runner active..."

              Start-Sleep -Seconds 600
          }
